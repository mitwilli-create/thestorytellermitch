language: en
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  related_issues: false
  related_prs: false
  auto_review:
    enabled: false
    drafts: false
    base_branches:
    - main
    auto_incremental_review: false
  path_filters:
  - '!resume/**'
  - '!output/**'
  - '!.wrangler/**'
  - '!package-lock.json'
  - '!*.lock'
  path_instructions:
  - path: '**'
    instructions: 'This is a static portfolio site. Raise findings only for defects
      in code BEHAVIOR, JavaScript/TypeScript and .mjs build/agent scripts: correctness
      bugs (wrong output, unhandled edge cases, broken control flow), security vulnerabilities
      (command injection, path traversal, SSRF, XSS, secret exposure), data-integrity
      risks, and regressions introduced by this diff. Do NOT raise pure presentation
      nitpicks,         CSS styling, spacing, color, copy/prose wording, or HTML formatting;
      those are caught deterministically by the site''s visual-regression and prose-lint
      gates, not by code review. Do NOT raise process/workflow reminders (slash-command
      discipline, commit-message conventions, "remember to" notes), those are enforced
      by the agent harness.'
  - path: tools/**
    instructions: Build/deploy scripts. Check for command injection, path traversal,
      unsafe shell interpolation, and missing error handling. deploy.sh is the only
      sanctioned deploy path, flag changes that bypass it.
  - path: scripts/**
    instructions: Site agent + build code. Check correctness, error handling, and
      secret exposure; no hardcoded tokens.
  finishing_touches:
    autofix:
      enabled: false
knowledge_base:
  code_guidelines:
    enabled: false
  learnings:
    scope: local
chat:
  auto_reply: false
